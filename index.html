<!DOCTYPE html>
<html lang="en"  data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="icon" href="static/icon/favicon.ico" type="image/x-icon">
  <link href="static/css/bootstrap.css" rel="stylesheet">
  <title>Telescope control</title>
  <style>
    .form-range::-webkit-slider-thumb {
      background: yellowgreen;
    }
    .form-range::-moz-range-thumb {
      background: yellowgreen;
    }
    .form-range::-ms-thumb {
      background: yellowgreen;
    }
    .nav-tabs > li > button:hover {
      color: rgb(173, 231, 57);
    }
    .nav-tabs > li > button {
      color: yellowgreen;
    }
    .btn-arrow{
      height:100px;
      width:100px;
      font-size: 24px;
    }

    .btn-head{
      height:50px;
      width:100px;
      font-size: 24px;
    }

    .btn-primary{
      background-color: yellowgreen;
      border-color: white;
    }
    .btn-primary:hover,
    .btn-primary:active    {
        background-color: #3276b1;
        color: #FFF;
        border-color: #285e8e;
    }

    .form-check-input:checked{
      background-color: rgb(212, 230, 178);
    }

  </style>
</head>

<body>
  <div class="container text-warning">
    <div class="row justify-content-center">
      <div class="col-md-6 col-sm-12 col-md-12 col-lg-12">

        <ul class="nav nav-tabs" id="myTab" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="home-tab" data-bs-toggle="tab" data-bs-target="#home-tab-pane" type="button" role="tab" aria-controls="home-tab-pane" aria-selected="true">Telescope</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile-tab-pane" type="button" role="tab" aria-controls="profile-tab-pane" aria-selected="false">Focuser</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="contact-tab" data-bs-toggle="tab" data-bs-target="#contact-tab-pane" type="button" role="tab" aria-controls="contact-tab-pane" aria-selected="false">Connection</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="disabled-tab" data-bs-toggle="tab" data-bs-target="#disabled-tab-pane" type="button" role="tab" aria-controls="disabled-tab-pane" aria-selected="false">Settings</button>
          </li>
        </ul>
        <div class="tab-content" id="myTabContent">
          <div class="tab-pane fade show active" id="home-tab-pane" role="tabpanel" aria-labelledby="home-tab" tabindex="0">
            <div class="container">
              <div class="input-group mb-3">
                <span class="input-group-text" id="comPortInfo">Disconnected</span>
                <select class="form-select" id="selectTelescopePort" aria-label="Default select example">
                  <option value="1" selected></option>
                </select>
                <button type="button" class="btn btn-primary" id="buttonTelescopeConnect">Connect</button>
                <button type="button" class="btn btn-primary" id="buttonTelescopeDisconnect">Disconnect</button>  
              </div>  

              <div class="row mt-2 justify-content-center">
                <div class="col" align="center">
                  
                </div>
              </div>

              <div class="row mt-2 justify-content-center">
                <div class="col" align="center">
                  <div class="btn-group" role="group">
                    <button class="btn btn-head btn-primary" type="button" id="buttonGoTo">Go To</button>
                    <button class="btn btn-head btn-primary" type="button" id="buttonMove">Move</button>
                    <button class="btn btn-head btn-primary" type="button" id="buttonHome">Home</button>
                    <button class="btn btn-head btn-primary" type="button" id="buttonSet">Set</button>
                  </div>
                </div>
              </div>

              <div class="row mt-2 justify-content-center">
                <div class="col" align="center">
                  <div class="btn-group" role="group">
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="syncSpeed" id="inlineRadio1" value="1" checked>
                      <label class="form-check-label" for="inlineRadio1">Low</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="syncSpeed" id="inlineRadio2" value="4">
                      <label class="form-check-label" for="inlineRadio2">Middle</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="syncSpeed" id="inlineRadio3" value="15">
                      <label class="form-check-label" for="inlineRadio3">Hight</label>
                    </div>
                  </div>
                </div>
              </div>
              
              <div class="row mt-2 justify-content-center">
                <div class="col" align="center">
                  <div class="btn-group" role="group">
                    <button class="btn btn-arrow btn-primary btn-lg" type="button" id="buttonLeftUp">&#8662;</button>
                    <button class="btn btn-arrow btn-primary btn-lg" type="button" id="buttonUp">&#8657;</button>
                    <button class="btn btn-arrow btn-primary btn-lg" type="button" id="buttonRightUp">&#8663;</button>
                  </div>
                </div>
              </div>
              <div class="row justify-content-center">
                <div class="col" align="center">
                  <div class="btn-group" role="group">
                    <button class="btn btn-arrow btn-primary btn-lg" type="button" id="buttonLeft">&#8656;</button>
                    <button class="btn btn-arrow btn-primary btn-lg" type="button" id="buttonStop">Stop</button>
                    <button class="btn btn-arrow btn-primary btn-lg" type="button" id="buttonRight">&#8658;</button>
                  </div>
                </div>
              </div>
              <div class="row justify-content-center">
                <div class="col" align="center">
                  <div class="btn-group" role="group">
                    <button class="btn btn-arrow btn-primary btn-lg" type="button" id="buttonDownLeft">&#8665;</button>
                    <button class="btn btn-arrow btn-primary btn-lg" type="button" id="buttonDown">&#8659;</button>
                    <button class="btn btn-arrow btn-primary btn-lg" type="button" id="buttonRightDown">&#8664;</button>
                  </div>
                </div>
              </div>

              <div class="row mt-2 justify-content-center">
                <div class="col" align="center">
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="inlineRadioOptions" id="sideEast" value="East">
                    <label class="form-check-label" for="sideRadio2">East</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="inlineRadioOptions" id="sideWest" value="West" checked>
                    <label class="form-check-label" for="sideRadio1">West</label>
                  </div>
                  <div class="row mt-2 justify-content-left">
                    <div class="col-sm"></div>
                    
                    <div class="col-sm"></div>
                  </div>
                </div>
              </div>

              <div class="row mt-2 justify-content-left">
                <div class="col" align="center">
                  <div class="col-sm"></div>
                  
                  <div class="col-sm"></div>
                </div>
              </div>

              <div class="row mt-2 justify-content-left">
                <div class="col" align="center">
                  <div class="col-sm"></div>
                  
                  <div class="col-sm"></div>
                </div>
              </div>
              
              <div class="accordion" id="accordionExample">
                <div class="accordion-item">
                  <h2 class="accordion-header" id="headingOne">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                      Stellarium
                    </button>
                  </h2>
                  <div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne" data-bs-parent="#accordionExample">
                    <div class="accordion-body">
                      <div class="form-check">
                        <div class="form-check form-check-inline">
                          <input class="form-check-input" type="checkbox" role="switch" id="stellariumConnect">
                          <label class="form-check-label stellariumInfo" for="flexCheckDefault">Stellarium is not connected!</label>
                        </div>
                      </div>
                      <div class="col-md-auto objectInfo">Stellarium is not connected!</div>
                      <div class="col-md-auto objectCoordinates"></div>
                      <div class="col-md-auto telescopCurrentCoordinates"></div>
                    </div>
                  </div>
                </div>
                <div class="accordion-item">
                  <h2 class="accordion-header" id="headingTwo">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                      Communication info
                    </button>
                  </h2>
                  <div id="collapseTwo" class="accordion-collapse collapse" aria-labelledby="headingTwo" data-bs-parent="#accordionExample">
                    <div class="accordion-body">
                      <div class="col-md-auto objectHa"></div>
                      <div class="col-md-auto objectDec"></div>

                      <div class="col-md-auto objectAz"></div>
                      <div class="col-md-auto objectAlt"></div>

                      <div class="col-md-auto telescopCurrentHa"></div>
                      <div class="col-md-auto telescopCurrentDec"></div>
                      <div class="col-md-auto telescopStatus"></div>
                    </div>
                  </div>
                </div>
                <div class="accordion-item">
                  <h2 class="accordion-header" id="headingThree">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                      Accordion Item #3
                    </button>
                  </h2>
                  <div id="collapseThree" class="accordion-collapse collapse" aria-labelledby="headingThree" data-bs-parent="#accordionExample">
                    <div class="accordion-body">
                      
                    </div>
                  </div>
                </div>
              </div>

            </div>
          </div>
          <div class="tab-pane fade" id="profile-tab-pane" role="tabpanel" aria-labelledby="profile-tab" tabindex="0">

            <div class="input-group mb-3">
              <span class="input-group-text" id="comPortInfoFocuser">Disconnected</span>
              <select class="form-select" id="selectFocuserPort" aria-label="Default select example">
                <option value="1" selected></option>
              </select>
              <button type="button" class="btn btn-primary" id="buttonFocuserConnect">Connect</button>
              <button type="button" class="btn btn-primary" id="buttonFocuserDisconnect">Disconnect</button>  
            </div>

            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="bahtinovMask">
              <label class="form-check-label" for="flexSwitchCheckChecked">Bahtinov Mask</label>
            </div>
            
            <div class="focuserValue">0</div>

            <label for="focuser" class="form-label">Focus</label>
            <input type="range" class="form-range" min="0" max="1000" id="focuser">

            <label for="focuserMicro" class="form-label">Micro focus</label>
            <input type="range" class="form-range" min="-50" max="50" id="focuserMicro">
          </div>
          <div class="tab-pane fade" id="contact-tab-pane" role="tabpanel" aria-labelledby="contact-tab" tabindex="0">
            <div class="container">
              <div class="input-group mb-3">
                
                
                <div class="row mt-2 justify-content-center">
                  <div class="col">
                    <div class="col-md-auto socketInfo">Socket disconnected!</div>
                    <button class="btn btn-primary" type="button" id="buttonSocketOpen">Open socket</button>
                  </div>
                  <div class="col">
                    <button class="btn btn-primary" type="button" id="buttonSocketSend">Open send</button>
                  </div>
                  <div class="col">
                    <input class="form-check-input" type="checkbox" role="switch" id="socketSend">
                    <label class="form-check-label socketInfo" for="flexCheckDefault">Socket send</label>
                  </div>
                </div>
              </div>
              </div>
              
              <div class="overflow-auto" style="height: 300px;">
                <p class="col-md-auto" id="telescopeComPortInfoLog"></p>
              </div>
              
              
            </div>
          </div>
          <div class="tab-pane fade" id="disabled-tab-pane" role="tabpanel" aria-labelledby="disabled-tab" tabindex="0">
            <div class="input-group mb-3">
              <label class="input-group-text">socket url</label>
              <input type="text" class="form-control" placeholder="socketUrl" aria-label="socketUrl" id="socketUrl" value="127.0.1.2:9997">
            </div>

            <div class="input-group mb-3">
              <label class="input-group-text" for="inputGroupSelect01">Type of telescope mount</label>
              <select class="form-select" id="inputGroupSelect01">
                <option value="EQ" selected>EQ</option>
                <option value="AZ">AZ</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="basic-url" class="form-label">Steps in full rotation</label>
              <div class="input-group">
                <span class="input-group-text" id="basic-addon3">Ra</span>
                <input type="text" class="form-control" placeholder="Ra" aria-label="Port" value="15360000">
                <span class="input-group-text">Dec</span>
                <input type="text" class="form-control" placeholder="Dec" aria-label="Port" value="15360000">
              </div>
              <div class="form-text" id="basic-addon4">Пример текста</div>
            </div>

            <button type="button" class="btn btn-success">Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="static/js/bootstrap.min.js"> </script>
  <script src="static/stellarium.js"></script>
  <script src="static/telescope.js"></script>
  <script src="static/settings.js"></script>
  <script src="static/focuser.js"></script>
  <script src="static/comPort.js"></script>
  <script src="static/socket.js"></script>
</body>

</html>
